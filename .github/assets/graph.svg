<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t">
  <title id="t">Four things built over five years, connected as one traversal through a quiet mesh: a sync pipeline, a CMDB, the rmine CLI and a workflow engine.</title>

  <style>
    .mesh-line { stroke: #404A5A; stroke-width: 1; stroke-opacity: 0.7; }
    .mesh-node { fill: #556274; }
    .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #F0EDE6; }
    .note  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #8590A2; }
    .micro { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #8590A2; letter-spacing: 0.14em; }
  </style>

  <rect width="1000" height="300" rx="8" fill="#0F1319"/>

  <text class="micro" x="40" y="40">FIVE YEARS, FOUR THINGS</text>

  <g class="mesh-line">
    <line x1="62" y1="138" x2="95" y2="88"/>
    <line x1="95" y1="88" x2="196" y2="96"/>
    <line x1="196" y1="96" x2="258" y2="44"/>
    <line x1="258" y1="44" x2="330" y2="28"/>
    <line x1="330" y1="28" x2="462" y2="40"/>
    <line x1="462" y1="40" x2="556" y2="62"/>
    <line x1="556" y1="62" x2="672" y2="96"/>
    <line x1="672" y1="96" x2="880" y2="132"/>
    <line x1="880" y1="132" x2="946" y2="76"/>
    <line x1="300" y1="128" x2="196" y2="96"/>
    <line x1="300" y1="128" x2="355" y2="196"/>
    <line x1="355" y1="196" x2="487" y2="168"/>
    <line x1="487" y1="168" x2="568" y2="224"/>
    <line x1="568" y1="224" x2="700" y2="254"/>
    <line x1="700" y1="254" x2="760" y2="176"/>
    <line x1="760" y1="176" x2="880" y2="132"/>
    <line x1="240" y1="252" x2="355" y2="196"/>
    <line x1="240" y1="252" x2="430" y2="268"/>
    <line x1="430" y1="268" x2="568" y2="224"/>
    <line x1="700" y1="254" x2="840" y2="262"/>
    <line x1="840" y1="262" x2="930" y2="214"/>
    <line x1="930" y1="214" x2="880" y2="132"/>
  </g>

  <g class="mesh-node">
    <circle cx="95" cy="88" r="2.5"/><circle cx="62" cy="138" r="2.5"/>
    <circle cx="196" cy="96" r="2.5"/><circle cx="258" cy="44" r="2.5"/>
    <circle cx="330" cy="28" r="2.5"/><circle cx="300" cy="128" r="2.5"/>
    <circle cx="355" cy="196" r="2.5"/><circle cx="462" cy="40" r="2.5"/>
    <circle cx="556" cy="62" r="2.5"/><circle cx="487" cy="168" r="2.5"/>
    <circle cx="568" cy="224" r="2.5"/><circle cx="672" cy="96" r="2.5"/>
    <circle cx="700" cy="254" r="2.5"/><circle cx="760" cy="176" r="2.5"/>
    <circle cx="880" cy="132" r="2.5"/><circle cx="946" cy="76" r="2.5"/>
    <circle cx="930" cy="214" r="2.5"/><circle cx="240" cy="252" r="2.5"/>
    <circle cx="430" cy="268" r="2.5"/><circle cx="840" cy="262" r="2.5"/>
  </g>

  <path class="path" d="M40,210 L185,168 L390,92 L600,150 L820,70"
        fill="none" stroke="#E0A84E" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="40" cy="210" r="3.5" fill="#E0A84E"/>

  <g>
    <circle cx="185" cy="168" r="15" fill="#E0A84E" fill-opacity="0.12"/>
    <circle cx="185" cy="168" r="5.5" fill="#E0A84E"/>
    <text class="label" x="201" y="190">sync</text>
    <text class="note"  x="201" y="207">12&#8211;15h &#8594; &lt;1h</text>
  </g>

  <g>
    <circle cx="390" cy="92" r="15" fill="#E0A84E" fill-opacity="0.12"/>
    <circle cx="390" cy="92" r="5.5" fill="#E0A84E"/>
    <text class="label" x="406" y="66">CMDB</text>
    <text class="note"  x="406" y="83">n-level traversal</text>
  </g>

  <g>
    <circle cx="600" cy="150" r="15" fill="#E0A84E" fill-opacity="0.12"/>
    <circle cx="600" cy="150" r="5.5" fill="#E0A84E"/>
    <text class="label" x="616" y="172">rmine</text>
    <text class="note"  x="616" y="189">Go, open source</text>
  </g>

  <g>
    <circle cx="820" cy="70" r="15" fill="#E0A84E" fill-opacity="0.12"/>
    <circle cx="820" cy="70" r="5.5" fill="#E0A84E"/>
    <text class="label" x="836" y="68">workflow</text>
    <text class="note"  x="836" y="85">node canvas</text>
  </g>
</svg>
